model:
  dropout: 0.2
  num_heads: 8
  num_layers: 1
  backbone: "ViT-B/16"
  dataset_name: "CUBirds"
  use_cache: false

training:
  epochs: 20
  batch_size: 8
  mode: "logits"
  device: "cuda:0"
  precision: "fp32"
  optimizer: "SGD"
  use_cutout: false
  increment_epochs: 0
  learning_rate: 0.002
  weight_decay: 0.0005

data:
  kshot: 1
  seed: 42
  val_size: 0.7
  num_workers: 4
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"

dirichlet:
  init_concentration: 1.0
  kl_weight: 0.1

logging:
  output_dir: "outputs/dirichlet"
