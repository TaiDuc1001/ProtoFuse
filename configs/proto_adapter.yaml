model:
  backbone: "ViT-B/16"
  alpha: 1.0
  search:
    enabled: true
    alpha_values: [0.1, 0.3, 0.5, 1.0, 2.0, 5.0]
  finetune:
    enabled: true
    epochs: 20
    lr: 0.0004
    weight_decay: 0.0
    margin: 0.2
    scale: 64.0

training:
  device: "cuda:0"
  precision: "fp32"
  batch_size: 256

data:
  dataset_name: "DTD"
  kshot: 16
  seed: 1
  num_workers: 4
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/DTD"
  base_novel:
    enabled: false
    split_ratio: 0.5

checkpoint:
  enabled: true
  cache_dir: "checkpoints/proto_adapter"

logging:
  output_dir: "outputs/proto_adapter"
