model:
  backbone: "ViT-B/16"
  text_prior_tau: 4.0
  augment_epoch: 10
  extra_text_shots: true
  scale_list: [1.0, 10.0, 100.0, 1000.0, 10000.0, 100000.0]
  alpha_list: [1, 2, 3, 4, 5, 6, 7, 8, 9]

training:
  device: "cuda:0"
  precision: "fp32"
  batch_size: 128

data:
  dataset_name: "DTD"
  kshot: 1
  seed: 1
  num_workers: 4
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/DTD"

checkpoint:
  enabled: true
  cache_dir: "checkpoints/tarp"

logging:
  output_dir: "outputs/tarp"

