model:
  dropout: 0.2
  num_heads: 8
  num_layers: 1
  backbone: "ViT-B/16"
  dataset_name: "CUBirds"
  use_cache: false
  mim_hidden_dim: 512
  mim_encoder_layers: 3
  mim_decoder_layers: 3
  mim_num_heads: 8
  mim_dropout: 0.1
  mask_ratio: 0.4

training:
  epochs: 10
  batch_size: 8
  mode: "logits"
  device: "cuda:0"
  precision: "fp32"
  optimizer: "SGD"
  use_cutout: false
  run_decoder: false
  increment_epochs: 0
  learning_rate: 0.001
  weight_decay: 0.0005
  confusion_matrix: false
  visualize_gradcam: false
  class_distribution: false
  visualize_attention: false

data:
  kshot: 1
  seed: 42
  val_size: 0.7
  num_workers: 4
  run_eda: false
  class_distribution: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"

logging:
  output_dir: "outputs/apt_mim"
