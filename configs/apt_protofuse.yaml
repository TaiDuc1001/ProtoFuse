model:
  dropout: 0.2
  num_heads: 8
  num_layers: 1
  backbone: "ViT-B/16"

posthoc_protofuse:
  enabled: true
  config_path: "configs/protofuse.yaml"
  save_prototypes: true

checkpoint:
  enabled: true
  cache_dir: "checkpoints/apt"

training:
  epochs: 20
  batch_size: 16
  mode: "logits"
  device: "cuda:0"
  precision: "fp32"
  optimizer: "SGD"
  learning_rate: 0.001
  weight_decay: 0.0005
  confusion_matrix: false
  visualize_gradcam: false
  class_distribution: false
  visualize_attention: false

data:
  dataset_name: "DTD"
  kshot: 4
  seed: 1
  num_workers: 8
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/DTD"
  base_novel:
    enabled: false
    split_ratio: 0.5

logging:
  output_dir: "outputs/apt"
