model:
  backbone: "ViT-B/16"
  n_ctx: 4
  ctx_init: ""
  dataset_name: "CUB-200-2011"

training:
  epochs: 10
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0005
  optimizer: "SGD"
  device: "cuda:0"
  precision: "fp32"
  confusion_matrix: false
  class_distribution: false

data:
  kshot: 1
  seed: 42
  val_size: 0.7
  num_workers: 4
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"
  base_novel:
    enabled: false
    split_ratio: 0.5

checkpoint:
  enabled: true
  cache_dir: "checkpoints/cocoop"

logging:
  output_dir: "outputs/cocoop"
