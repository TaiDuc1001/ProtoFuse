model:
  n_ctx: 2
  ctx_init: "a photo of a"
  prompt_depth: 9
  backbone: "ViT-B/16"
  dataset_name: "CUB-200-2011"

fixmatch:
  enabled: true
  confidence: 0.95
  wu: 1.0
  unlabeled_batch_size: 56

checkpoint:
  enabled: true
  cache_dir: "checkpoints/fixmatch_maple"

training:
  epochs: 10
  batch_size: 8
  mode: "logits"
  device: "cuda:0"
  precision: "fp32"
  optimizer: "SGD"
  learning_rate: 0.0035
  weight_decay: 0.0005

data:
  kshot: 16
  seed: 42
  val_size: 0.2
  num_workers: 8
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"

logging:
  output_dir: "outputs/fixmatch_maple"
