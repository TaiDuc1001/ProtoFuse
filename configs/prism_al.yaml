model:
  dropout: 0.2
  num_heads: 8
  num_layers: 1
  backbone: "ViT-B/16"

checkpoint:
  enabled: true
  cache_dir: "checkpoints/active_learning"

training:
  epochs: 10
  batch_size: 16
  mode: "logits"
  device: "cuda:0"
  precision: "fp32"
  optimizer: "SGD"
  learning_rate: 0.001
  weight_decay: 0.0005
  confusion_matrix: false
  visualize_gradcam: false
  class_distribution: false
  visualize_attention: false

data:
  dataset_name: "CUB-200-2011"
  val_size: 0.7
  kshot: 1
  seed: 1
  num_workers: 8
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"
  base_novel:
    enabled: false
    split_ratio: 0.5

active_learning:
  model_type: "APT"
  strategy: "prism"
  kshot_budget: 1
  num_rounds: 4

prism:
  # --- Scoring weights (tex Section 6, Table 2) ---
  lambda1: 0.3
  lambda2: 0.5
  lambda2_decay: 0.8
  lambda2_min: 0.1

  # --- Selection (tex Table 2) ---
  novelty_threshold_percentile: 75
  novel_budget_fraction: 0.5
  novel_budget_fraction_min: 0.2
  novel_budget_fraction_decay: 0.85
  candidate_pool_multiplier: 5

  # --- Pseudo-labeling (tex Section 5) ---
  # weighted_consensus (implemented) | dawid_skene (future)
  pseudo_label_method: "weighted_consensus"
  pseudo_label_threshold: 0.85
  agreement_entropy_threshold: 0.5
  flag_conflicted_as_priority: true
  adaptive_threshold: true
  adaptive_threshold_beta: 0.95

  # --- ALFA-Mix (tex Section 2) ---
  alpha_cap: 0.1
  alpha_growth_step: 0.1
  alpha_closed_form: true

  # --- Projection heads (tex Eq. 6) ---
  projection_head_epochs: 50
  projection_head_lr: 0.001

  # --- Model weighting (tex Eq. 3) ---
  per_class_weights: false
  finetune_per_round: false

  # --- Novelty method (tex Eq. 7 vs Eq. 8) ---
  # mahalanobis (Eq. 7, primary) | energy (Eq. 8, alternative)
  novelty_method: "mahalanobis"

  # --- Multi-model ensemble (tex Table 3) ---
  models:
    - type: "clip"
      backbone: "ViT-B/16"
      weights_dir: "models"
      role: "primary"
    - type: "dinov2"
      variant: "dinov2_vitb14"
      role: "novelty"
    - type: "resnet50"
      pretrained: true
      role: "diversity"

logging:
  output_dir: "outputs/prism_al"
