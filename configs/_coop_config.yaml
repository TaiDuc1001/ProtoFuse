model:
  backbone: "ViT-B/16"
  n_ctx: 16
  ctx_init: ""
  csc: false
  class_token_position: "end"
  dataset_name: "CUBirds"

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.002
  weight_decay: 0.0005
  optimizer: "SGD"
  device: "cuda:0"
  precision: "fp32"
  confusion_matrix: false
  class_distribution: false

data:
  kshot: 1
  seed: 42
  val_size: 0.7
  num_workers: 4
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"

checkpoint:
  enabled: true
  cache_dir: "checkpoints"

logging:
  output_dir: "outputs/coop"
