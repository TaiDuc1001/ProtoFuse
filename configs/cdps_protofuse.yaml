model:
  backbone: "ViT-B/16"
  omega: 0.1
  num_confuse: 5
  topk: 20
  top_percent: 0.4
  tgt_area: 2

posthoc_protofuse:
  enabled: true
  config_path: "configs/protofuse.yaml"
  save_prototypes: true

training:
  device: "cuda:0"
  precision: "fp32"
  batch_size: 32

data:
  dataset_name: "DTD"
  kshot: 1
  seed: 1
  num_workers: 4
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/DTD"
  base_novel:
    enabled: false
    split_ratio: 0.5

checkpoint:
  enabled: true
  cache_dir: "checkpoints/cdps"

logging:
  output_dir: "outputs/cdps"

