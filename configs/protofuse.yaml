model:
  backbone: "ViT-B/16"
  alpha_steps: 101
  centroid_mix:
    beta_values: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45]

training:
  device: "cuda:0"
  precision: "fp32"
  batch_size: 128

data:
  dataset_name: "DTD"
  kshot: 16
  seed: 1
  num_workers: 4
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/DTD"

checkpoint:
  enabled: true
  cache_dir: "checkpoints/protofuse"

logging:
  output_dir: "outputs/protofuse"
