model:
  backbone: "ViT-B/16"
  alpha_steps: 101
  hopc_repeats: 16
  hopc_var_lambda: 0.0
  hopc_logit_scale: 1.0

training:
  device: "cuda:0"
  precision: "fp32"
  batch_size: 128

data:
  dataset_name: "CUB-200-2011"
  kshot: 16
  seed: 1
  num_workers: 4
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"

checkpoint:
  enabled: true
  cache_dir: "checkpoints/protofuse"

logging:
  output_dir: "outputs/protofuse"
