model:
  backbone: "ViT-B/16"
  init_alpha: 1.0
  init_beta: 1.0
  init_gamma: 0.1
  w_training_free: [0.5, 0.5]
  w_training: [0.2, 0.8]
  training_free_feat_num: 800
  training_feat_num: 900
  augment_epoch: 10
  search:
    scale: [7, 7, 1]
    step: [200, 20, 20]
  finetune:
    enabled: false
    epochs: 30
    lr: 0.001
    eps: 0.001

training:
  device: "cuda:0"
  precision: "fp32"
  batch_size: 128

data:
  dataset_name: "CUB-200-2011"
  kshot: 1
  seed: 1
  num_workers: 4
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"

checkpoint:
  enabled: true
  cache_dir: "checkpoints/ape"

logging:
  output_dir: "outputs/ape"
