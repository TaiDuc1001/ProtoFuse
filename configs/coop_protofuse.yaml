model:
  backbone: "ViT-B/16"
  n_ctx: 16
  ctx_init: ""
  csc: false
  class_token_position: "end"

posthoc_protofuse:
  enabled: true
  config_path: "configs/protofuse.yaml"
  save_prototypes: true

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.002
  weight_decay: 0.0005
  optimizer: "SGD"
  device: "cuda:0"
  precision: "fp32"
  confusion_matrix: false
  class_distribution: false

data:
  dataset_name: "CUB-200-2011"
  kshot: 4
  seed: 1
  num_workers: 4
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"
  base_novel:
    enabled: false
    split_ratio: 0.5

checkpoint:
  enabled: true
  cache_dir: "checkpoints/coop"

logging:
  output_dir: "outputs/coop"
