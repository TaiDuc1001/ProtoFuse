model:
  backbone: "ViT-B/16"
  num_tokens: 10
  deep_prompting: true
  prompt_dropout: 0.1
  prompt_project: -1
  dataset_name: "CUBirds"

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.1
  weight_decay: 0.01
  optimizer: "SGD"
  device: "cuda:0"
  precision: "fp32"
  confusion_matrix: false
  class_distribution: false
  warmup_epochs: 10

data:
  kshot: 1
  seed: 42
  val_size: 0.7
  num_workers: 4
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"

checkpoint:
  enabled: false
  cache_dir: "checkpoints/vpt"

logging:
  output_dir: "outputs/vpt"
