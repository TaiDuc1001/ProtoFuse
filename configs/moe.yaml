model:
  dropout: 0.2
  backbone: "ViT-B/16"
  num_heads: 8
  moe:
    num_groups: 4
    warmup_epochs: 10
    diversity_weight: 0.1
    load_balance_weight: 0.01

checkpoint:
  enabled: true
  cache_dir: "checkpoints/moe"

training:
  epochs: 50
  batch_size: 16
  mode: "logits"
  device: "cuda:0"
  precision: "fp32"
  optimizer: "SGD"
  learning_rate: 0.001
  weight_decay: 0.0005
  confusion_matrix: false
  visualize_gradcam: false
  class_distribution: false
  visualize_attention: false

data:
  dataset_name: "CUB-200-2011"
  val_size: 0.7
  kshot: 1
  seed: 1
  num_workers: 8
  run_eda: false
  clip_mean: [0.48145466, 0.4578275, 0.40821073]
  clip_std: [0.26862954, 0.26130258, 0.27577711]
  root: "datasets/cub-200-2011-renamed"
  base_novel:
    enabled: false
    split_ratio: 0.5

logging:
  output_dir: "outputs/moe"
